{% assign settings = site.data.site_settings %}
<header class="xm-header">
  <div class="xm-shell xm-header-inner">
    <a class="xm-brand" href="{{ '/' | relative_url }}">
      {% if settings.avatar and settings.avatar != '' %}
      <img class="xm-logo-image" src="{{ settings.avatar | relative_url }}" alt="{{ settings.site_name | default: '九月影' }}">
      {% else %}
      <span class="xm-logo">九</span>
      {% endif %}
      <span class="xm-brand-text">{{ settings.site_name | default: '九月影' }}</span>
    </a>

    <input id="xm-nav-toggle" class="xm-nav-toggle" type="checkbox">
    <label for="xm-nav-toggle" class="xm-nav-button" aria-label="打开导航"><span></span><span></span><span></span></label>

    <nav class="xm-nav" aria-label="主导航">
      {% for item in site.data.top_nav %}
      <a href="{{ item.url | relative_url }}"{% if page.nav_key == item.key %} class="active"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>

    <label class="xm-search" for="xm-search-input">
      <svg class="xm-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="xm-search-input" type="search" placeholder="搜索当前模块" autocomplete="off">
    </label>
  </div>
</header>

<style>
.xm-module-filter{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:11px 14px;
  background:var(--xm-surface);border:1px solid var(--xm-border);
  border-radius:var(--xm-radius);box-shadow:var(--xm-shadow-sm);
}
.xm-module-filter-label{flex:none;color:var(--xm-muted);font-size:13px;font-weight:700}
.xm-module-filter-box{
  margin-left:auto;width:min(320px,55%);height:38px;
  border:1px solid var(--xm-border);border-radius:var(--xm-radius-pill);
  background:var(--xm-surface-soft);display:flex;align-items:center;gap:8px;padding:0 13px;
  transition:border-color .2s var(--xm-ease),background-color .2s var(--xm-ease),
             box-shadow .2s var(--xm-ease);
}
.xm-module-filter-box:focus-within{
  border-color:var(--xm-accent);background:var(--xm-surface);
  box-shadow:0 0 0 3px var(--xm-accent-ring);
}
.xm-module-filter-box svg{width:16px;height:16px;flex:none;color:var(--xm-faint)}
.xm-module-filter-box input{
  width:100%;border:0;outline:0;background:transparent;
  color:var(--xm-text);font-size:13.5px;font-family:inherit;
}
.xm-module-filter-box input::placeholder{color:var(--xm-faint)}
.xm-module-filter-box input::-webkit-search-cancel-button{filter:grayscale(1);opacity:.5;cursor:pointer}
@media(max-width:760px){
  .xm-module-filter{align-items:flex-start;flex-direction:column}
  .xm-module-filter-box{margin-left:0;width:100%}
}
</style>

<div class="xm-module-filter">
  <span class="xm-module-filter-label">当前模块筛选</span>
  <label class="xm-module-filter-box" for="xm-module-filter-input">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="xm-module-filter-input" type="search" placeholder="{{ include.placeholder | default: '筛选当前模块' }}" autocomplete="off">
  </label>
</div>

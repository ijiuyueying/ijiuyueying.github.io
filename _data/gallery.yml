# =========================
# 新增图集说明
# -------------------------
# 1. 把图片放进 assets/images/gallery/<分组名>/
# 2. 在下面追加一条，字段含义：
#    title       图集标题（页面卡片上显示）
#    image       站内路径，必须以 /assets/ 开头
#    description 一句话说明这张图讲什么
#    group       一级分组（对应左侧菜单）
#    subgroup    二级分组（对应子菜单）
#    source      可选，图片出处或参考资料链接
# 注意：不要使用外链图片，第三方图床随时可能失效。
# =========================

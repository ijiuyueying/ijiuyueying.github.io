<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f4f5;color:#30343b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}a{text-decoration:none;color:inherit}.xm-shell{width:min(1420px,calc(100% - 36px));margin:0 auto}.xm-header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid #e4e7ea;box-shadow:0 2px 8px rgba(0,0,0,.05)}.xm-header-inner{height:74px;display:flex;align-items:center;gap:34px}.xm-brand{display:flex;align-items:center;gap:13px;flex:none}.xm-logo{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#263445,#414c61);color:#fff;font-size:20px;font-weight:800;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}.xm-brand-text{font-size:27px;font-weight:800;color:#303741;white-space:nowrap}.xm-nav{display:flex;align-items:stretch;height:100%;gap:2px}.xm-nav a{display:flex;align-items:center;padding:0 20px;color:#626a73;font-size:17px;font-weight:600;border-bottom:3px solid transparent;transition:.18s}.xm-nav a:hover,.xm-nav a.active{color:#2990df;border-bottom-color:#2990df}.xm-search{margin-left:auto;width:270px;height:44px;border:1px solid #e0e5e9;border-radius:24px;background:#f5f7f8;display:flex;align-items:center;padding:0 14px;gap:9px}.xm-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:#444}.xm-nav-toggle,.xm-nav-button{display:none}.site-main{padding:22px 0 50px}.xm-home-grid{width:min(1420px,calc(100% - 36px));margin:0 auto;display:grid;grid-template-columns:145px minmax(0,1fr) 330px;gap:20px;align-items:start}.xm-left-menu{position:sticky;top:96px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.08);overflow:hidden}.xm-center{min-width:0}.xm-hero{position:relative;height:275px;margin-bottom:18px;background:#202832;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.1)}.xm-slide{position:absolute;inset:0;opacity:0;transform:scale(1.025);transition:opacity .55s ease,transform .7s ease;pointer-events:none;background:linear-gradient(135deg,#27313d,#405064)}.xm-slide.active{opacity:1;transform:scale(1);pointer-events:auto}.xm-slide img{width:100%;height:100%;object-fit:cover}.xm-slide-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,19,25,.55),rgba(15,19,25,.08) 65%,rgba(15,19,25,.18))}.xm-slide-copy{position:absolute;left:28px;right:28px;bottom:26px;color:#fff}.xm-slide-copy span{font-size:12px;opacity:.85}.xm-slide-copy h2{margin:5px 0 5px;font-size:27px;line-height:1.35}.xm-slide-copy p{max-width:650px;margin:0;font-size:14px;opacity:.88}.xm-dots{position:absolute;left:50%;bottom:10px;display:flex;gap:8px;transform:translateX(-50%);z-index:5}.xm-dots button{width:10px;height:10px;padding:0;border:2px solid #fff;border-radius:50%;background:transparent;cursor:pointer}.xm-dots button.active{background:#e82921;border-color:#e82921}.xm-post-list{display:grid;gap:14px}.xm-post-card{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;transition:opacity .22s ease,transform .22s ease}.xm-post-card.hidden{display:none}.xm-post-card.animate-in{animation:xmFade .32s ease both}@keyframes xmFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.xm-post-cover{display:block;height:230px;overflow:hidden}.xm-post-cover img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.xm-post-cover:hover img{transform:scale(1.025)}.xm-post-content{padding:24px 28px 22px}.xm-post-content h2{margin:0 0 6px;color:#b13b32;font-size:25px;font-weight:500}.xm-post-content h2 a:hover{color:#e05246}.xm-meta{color:#8b9197;font-size:13px;margin-bottom:12px}.xm-post-content p{margin:0;color:#43484e;font-size:15px}.xm-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px;padding-top:14px;border-top:1px solid #eceeef}.xm-tags span{padding:5px 12px;border:1px solid #e0e4e7;border-radius:2px;color:#555;font-size:12px}.xm-rightbar{display:grid;gap:14px;position:sticky;top:96px}.xm-side-card{background:#fff;padding:18px 20px;box-shadow:0 2px 14px rgba(0,0,0,.08)}.xm-side-title{font-size:18px;font-weight:800;margin-bottom:9px}.xm-recommend-list{display:grid}.xm-recommend-list a{padding:5px 0;color:#535a62;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xm-recommend-list a:hover{color:#2990df}.xm-collection-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.xm-collection-grid a{padding:12px;border:1px solid #edf0f2;background:#fafbfb}.xm-collection-grid b,.xm-collection-grid span{display:block}.xm-collection-grid b{font-size:13px}.xm-collection-grid span{margin-top:2px;color:#949ba2;font-size:10px}.xm-collection-grid a:hover{border-color:#b9d9ef;background:#f4faff}.xm-page{width:min(1180px,calc(100% - 36px));margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.07)}.xm-page-head{padding:22px 28px;border-bottom:1px solid #eceeef}.xm-page-head h1{margin:0;font-size:28px}.xm-page-head p{margin:5px 0 0;color:#8a9198;font-size:13px}.xm-page-body{padding:26px 28px}.xm-nav-grid,.xm-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.xm-nav-item,.xm-media-item{padding:17px;border:1px solid #e6e8ea;background:#fff;transition:.18s}.xm-nav-item:hover,.xm-media-item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}.xm-nav-item h3,.xm-media-item h3{margin:0 0 5px;font-size:16px}.xm-nav-item p,.xm-media-item p{margin:0;color:#8c939a;font-size:12px}.xm-media-item img,.xm-media-item video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;margin-bottom:10px;background:#111}.xm-music-list{display:grid;gap:10px}.xm-music-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #eceeef}.xm-music-row b{font-size:14px}.xm-music-row span{color:#9aa0a6;font-size:12px}.article-head-new{padding:25px 30px;background:#fff;border-bottom:1px solid #eceeef;box-shadow:0 2px 14px rgba(0,0,0,.06)}.article-head-new h1{margin:8px 0 8px;color:#b13b32;font-weight:500}.article-body-new{padding:30px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.06)}.article-body-new pre{overflow:auto;padding:16px;background:#1f2328;color:#e6edf3}.article-body-new code{background:#f2f3f4;padding:2px 5px}.article-body-new pre code{background:transparent;padding:0}.article-body-new img{max-width:100%;height:auto}.article-toc-new{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.06)}.article-pager-new{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}.article-pager-new a{border:1px solid #e6e8ea;padding:12px}.article-pager-new .next{text-align:right}.backtop-new{position:fixed;right:20px;bottom:20px;width:42px;height:42px;border:0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.16);opacity:0;visibility:hidden}.backtop-new.show{opacity:1;visibility:visible}.site-footer{margin-top:35px;padding:28px 0;background:#fff;border-top:1px solid #e5e8ea;color:#8b9299;text-align:center;font-size:12px}.xm-empty{padding:35px;text-align:center;color:#999}.page-shell-new{width:min(1180px,calc(100% - 36px));margin:0 auto}.page-head-new,.page-content-new{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.06)}.page-head-new{padding:24px 28px;border-bottom:1px solid #eceeef}.page-head-new h1{margin:0;font-size:30px}.page-head-new p{margin:6px 0 0;color:#858d95;font-size:14px}.page-content-new{padding:28px;font-size:16px;line-height:1.85}.page-content-new h2{margin-top:30px;padding-bottom:8px;border-bottom:1px solid #eceeef}.page-content-new img{max-width:100%;height:auto}
    @media(max-width:1100px){.xm-home-grid{grid-template-columns:120px minmax(0,1fr)}.xm-rightbar{display:none}.xm-search{width:210px}.xm-brand-text{font-size:23px}}
    @media(max-width:760px){.xm-shell,.xm-home-grid,.xm-page,.page-shell-new{width:min(100% - 20px,1180px)}.xm-header-inner{height:auto;min-height:64px;flex-wrap:wrap;gap:10px}.xm-logo{width:38px;height:38px}.xm-brand-text{font-size:21px}.xm-nav-button{display:block;margin-left:auto}.xm-nav-button span{display:block;width:22px;height:2px;background:#555;margin:5px 0}.xm-nav-toggle:not(:checked)~.xm-nav{display:none}.xm-nav{order:4;width:100%;height:auto;display:flex;flex-direction:column}.xm-nav a{padding:10px;border-bottom:0}.xm-search{order:3;width:160px;height:38px}.xm-home-grid{grid-template-columns:1fr}.xm-left-menu{position:static}.xm-rightbar{display:grid;position:static}.xm-hero{height:220px}.xm-slide-copy h2{font-size:21px}.xm-nav-grid,.xm-media-grid{grid-template-columns:1fr}.xm-post-content{padding:20px}.xm-post-content h2{font-size:21px}.article-pager-new{grid-template-columns:1fr}.article-pager-new .next{text-align:left}}
  </style>
  {% include site-theme.html %}
</head>
<body>
  {% include header.html %}
  <main class="site-main">{{ content }}</main>
  <footer class="site-footer"><div class="xm-shell">© {{ 'now' | date: '%Y' }} 九月影 · 记录项目、网址与收藏。</div></footer>
</body>
</html>

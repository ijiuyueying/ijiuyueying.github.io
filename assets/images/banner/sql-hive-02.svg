  <circle cx="240" cy="380" r="180" fill="#8b5cf6" opacity=".16"/>
  <rect x="0" y="286" width="1200" height="1.5" fill="#8b5cf6" opacity=".30"/>
  <circle cx="156" cy="286" r="5" fill="#8b5cf6" opacity=".85"/>
  <rect width="1200" height="420" fill="url(#scrim)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="SQL/Hive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0"/>
      <stop offset=".45" stop-color="#0b1220" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity=".92"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="960" cy="120" rx="520" ry="330" fill="url(#glow)"/>

  <circle cx="1010" cy="96" r="210" fill="#8b5cf6" opacity=".30"/>
  <circle cx="1010" cy="96" r="210" fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="1010" cy="96" r="128" fill="none" stroke="#8b5cf6" stroke-opacity=".38" stroke-width="1.5"/>
  <circle cx="1152" cy="330" r="70" fill="#8b5cf6" opacity=".18"/>
  <path d="M0 300 H1200" stroke="#8b5cf6" stroke-opacity=".22" stroke-width="1"/>
  <path d="M0 342 H1200" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="1"/>
  <rect width="1200" height="420" fill="url(#scrim)"/>
</svg>

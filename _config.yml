title: 九月影
tagline: 数据开发 · 数据分析 · 项目实操
description: 记录银行监管报送、制造业数仓、电商数据分析、SQL、Python 与项目学习过程。
lang: zh-CN
url: "https://ijiuyueying.github.io"
baseurl: ""
timezone: Asia/Shanghai

markdown: kramdown
permalink: /articles/:title.html
show_excerpts: true

collections:
  menu_defs:
    output: false
  collection_defs:
    output: false

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - docs
  - 发布博客.bat
  - 同步博客.bat
  - 新建博客文章.bat
  - 新建博客文章.ps1
  - 导入数仓流程图.bat
  - _scripts
  - .gitignore
